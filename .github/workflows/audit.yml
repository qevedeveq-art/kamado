name: Data audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Regenerate data extracts
        run: node scripts/extract-data.js

      - name: Verify extracts are committed and up to date
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "::error::data/ is out of sync with index.html. Run 'node scripts/extract-data.js' and commit."
            git status --porcelain data/
            git diff data/ | head -200
            exit 1
          fi

      - name: Run recipe audit
        run: node scripts/audit-data.js

      - name: Run kamado expert audit
        run: node scripts/audit-kamado-expert.js

      - name: Run cross-agent recipe quality audit
        run: node scripts/audit-recipe-quality.js

      - name: Run chef safety and allergen audit
        run: node scripts/audit-chef.js

      - name: Run sommelier audit
        run: node scripts/audit-sommelier.js

      - name: Enforce PWA performance budget
        run: node scripts/audit-performance-budget.js

      - name: Run unit tests
        run: node --test 'tests/*.test.js'

      - name: Install isolated Chromium smoke runner
        run: |
          npm install --prefix "$RUNNER_TEMP/kamado-e2e" --no-save playwright@1.63.0
          "$RUNNER_TEMP/kamado-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run browser smoke test
        env:
          NODE_PATH: ${{ runner.temp }}/kamado-e2e/node_modules
        run: node scripts/browser-smoke.js
