<meta name="theme-color" content="#2b1d16">
<title>Livre de recettes — Kamado Kokko</title>
<style>
:root{
  --bg:#141611; --bg2:#1d2019; --card:#25291f; --card2:#303624;
  --line:#4a513d; --txt:#f4efe7; --muted:#b9bea9; --accent:#d86f32;
  --accent2:#f0b35a; --ember:#c64a1c; --green:#8faf63; --blue:#72a7c7;
  --shadow:0 6px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;
}
a{color:var(--accent2);text-decoration:none}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .4em}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}

/* Header */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#2b1d16 0%,#241811 100%);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;padding:0 14px}
.flame{font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.search{padding:8px 14px 4px}
.search input{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);font-size:16px;outline:none;
}
.search input::placeholder{color:var(--muted)}
.quickstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px 2px}
.qstat{background:rgba(55,38,25,.72);border:1px solid rgba(224,112,31,.24);border-radius:12px;padding:8px 9px;min-width:0}
.qstat b{display:block;color:var(--accent2);font-size:15px;line-height:1.1}
.qstat span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tabs */
.tabs{display:flex;gap:6px;padding:6px 14px 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Category chips */
.chips{display:flex;gap:7px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;padding:6px 12px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;font-weight:500;
}
.chip.active{background:var(--ember);color:#fff;border-color:var(--ember)}

section{padding:14px 0 30px}
.hide{display:none}

/* Recipe cards */
.count{color:var(--muted);font-size:12.5px;padding:4px 14px 0}
.grid{display:flex;flex-direction:column;gap:11px;padding:10px 14px 0}
.rc{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  cursor:pointer;transition:transform .08s;box-shadow:var(--shadow);
}
.rc:active{transform:scale(.99)}
.rc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc h3{font-size:16px;margin:0 0 3px}
.rc .ori{color:var(--accent2);font-size:12px;font-weight:600}
.rc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.badge{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.badge.mode{color:var(--accent2)}
.badge.temp{color:var(--ember)}
.badge.coeur{color:var(--green)}
.emoji{font-size:30px;line-height:1}

/* Detail modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;overflow-y:auto}
.modal.open{display:block}
.sheet{
  background:var(--bg2);max-width:780px;margin:0 auto;min-height:100%;
  border-radius:0;padding:0 0 50px;
}
.sheet-head{
  position:sticky;top:0;background:linear-gradient(180deg,#2b1d16,#241811);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;z-index:5;
}
.back{font-size:22px;background:none;border:none;color:var(--accent2);cursor:pointer;padding:4px}
.sheet-head h2{font-size:17px;margin:0;flex:1}
.sheet-body{padding:16px}
.sheet-body .ori{color:var(--accent2);font-weight:600;font-size:13px;margin-bottom:10px}
.specbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:74px;flex:1}
.spec .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.spec .v{font-size:14px;font-weight:700;margin-top:2px}
.spec .v.temp{color:var(--accent2)} .spec .v.coeur{color:var(--green)}
.sheet-body h4{font-size:14px;color:var(--accent2);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:5px}
.ings{list-style:none;padding:0;margin:0}
.ings li{padding:6px 0 6px 24px;border-bottom:1px solid rgba(74,53,38,.4);font-size:14.5px;position:relative}
.ings li:before{content:"•";color:var(--accent);position:absolute;left:6px;font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:9px 0 9px 38px;position:relative;font-size:14.5px;border-bottom:1px solid rgba(74,53,38,.4)}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:25px;height:25px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.tip{background:var(--card2);border-left:3px solid var(--accent2);border-radius:8px;padding:11px 13px;margin-top:16px;font-size:13.5px}
.tip b{color:var(--accent2)}

/* Guide & tables */
.prose{padding:4px 14px}
.prose h2{font-size:20px;margin-top:22px;color:var(--accent2)}
.prose h3{font-size:16px;margin-top:18px}
.prose p{font-size:14.5px;color:var(--txt)}
.callout{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.callout h3{margin-top:0;color:var(--accent2)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:var(--accent2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
td b{color:var(--txt)}
.t-temp{color:var(--accent2);font-weight:700;white-space:nowrap}
.t-coeur{color:var(--green);font-weight:700;white-space:nowrap}
.vent{display:inline-block;width:34px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ember),var(--accent2));vertical-align:middle}
.legend{font-size:12px;color:var(--muted);margin:6px 0 18px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle}
.steps-min{list-style:none;padding:0;counter-reset:m}
.steps-min li{counter-increment:m;padding:8px 0 8px 36px;position:relative;font-size:14px;border-bottom:1px solid rgba(74,53,38,.4)}
.steps-min li:before{content:counter(m);position:absolute;left:0;top:7px;width:24px;height:24px;background:var(--ember);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 14px 40px;border-top:1px solid var(--line);margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 3px 2px 0}
.toc{display:flex;flex-direction:column;gap:0}
.toc a{padding:11px 4px;border-bottom:1px solid var(--line);color:var(--txt);font-size:14.5px;display:flex;justify-content:space-between}
.toc a:after{content:"›";color:var(--accent2);font-size:18px}

/* ---- Filtres avancés ---- */
#filterbar{display:flex;flex-wrap:wrap;gap:7px;padding:8px 14px 2px}

/* ===== CUISINES DU MONDE ===== */
{cat:"monde",nom:"Picanha grillée (rumsteak brésilien)",ori:"Brésil · l'étoile du churrasco",pour:"4 pers",mode:"Direct",tempK:"280 °C",coeur:"54 °C (rosé)",temps:"15–20 min",bois:"—",tags:"picanha bresil churrasco rumsteak gros sel",

{cat:"monde",nom:"Bulgogi (bœuf mariné coréen)",ori:"Corée · barbecue coréen",pour:"4 pers",mode:"Direct (plaque)",tempK:"260 °C",coeur:"cuit",temps:"6–8 min",bois:"—",tags:"bulgogi coree boeuf soja poire sesame kbbq",

<h2>3. Les 3 configurations de cuisson</h2>

<h3>① Cuisson directe (saisie)</h3>
<p>Grille posée directement au-dessus des braises. Pour <b>steaks, brochettes, légumes, burgers, saucisses, gambas</b>. Marques de grill et réaction de Maillard. Évents 50–75 %, <b>200–350 °C</b>. Utilisez l'<b>extension de grille</b> en étage haut comme « zone froide » pour réserver les pièces déjà saisies.</p>

<h3>② Cuisson indirecte (four)</h3>
<p>On intercale la <b>pierre à pizza céramique en déflecteur</b> entre les braises et l'aliment : la chaleur tournante cuit sans flamme directe. Pour <b>rôtis, volailles entières, côtes, gratins, pains</b>. Évents 25–50 %, <b>150–200 °C</b>. C'est le mode « zéro flamme léchante ».</p>

<h3>③ Fumage &amp; basse température (low &amp; slow)</h3>
<p>Configuration indirecte + <b>morceaux de bois aromatique</b> sur les braises, foyer chargé à ras. <b>100–130 °C pendant 4 à 14 h</b>. Pour <b>poitrine de bœuf (brisket), épaule de porc effilochée, travers</b>. Le L 18" tient sa température <b>plus de 10 h</b> sans intervention. <b>On n'ouvre pas le couvercle</b> inutilement (−50 °C à chaque ouverture).</p>

<h3>🪵 Quel bois pour quelle viande</h3>

</div>

<h2>4. Réussir la pierre à pizza</h2>
<ol class="steps-min">
  <li>Posez la pierre <b>à froid</b> sur la grille (jamais sur une pierre brûlante un pâton froid : choc thermique).</li>
  <li>Montez à <b>350–400 °C</b>, évents grands ouverts, et laissez la pierre chauffer <b>au moins 30 min</b>.</li>
  <li>Enfournez la pizza, couvercle fermé, <b>3 à 5 min</b>. Tournez à mi-cuisson (la chaleur est plus forte vers le fond).</li>
  <li>La pierre sert aussi de déflecteur : gardez-la en place pour enchaîner pains, focaccia, tartes.</li>
</ol>

<h2>5. Sécurité & erreurs à éviter</h2>
<div class="callout">
<p><b>⚠️ Flashback (coup de flamme).</b> Après une cuisson grasse à couvercle fermé, l'oxygène manque. Avant d'ouvrir en grand : <b>entrouvrez de quelques cm, attendez 3–5 s</b>, puis ouvrez. Ne mettez jamais le visage au-dessus.</p>
<p><b>🧊 Jamais de choc thermique.</b> Pas d'eau froide sur céramique chaude, pas d'allumage d'un kamado gelé sans montée progressive.</p>
<p><b>🚪 On n'ouvre pas tout le temps.</b> « Looking is not cooking » : chaque ouverture fait chuter la temp de ~50 °C et rallonge la cuisson.</p>
<p><b>🌡️ Le thermomètre du couvercle</b> indique la température du dôme, pas celle à hauteur de grille (souvent 10–20 °C de plus en bas). Pour la précision, un thermomètre à sonde dans la viande est votre meilleur allié.</p>
</div>

<h2>6. Extinction & entretien</h2>
<p><b>Pour éteindre :</b> fermez les deux évents complètement — le feu s'étouffe en quelques minutes et le charbon restant resservira.</p>
<p><b>Après chaque cuisson :</b> brossez la grille tiède (brosse inox). <b>Toutes les 5–10 utilisations :</b> autonettoyage à <b>~350 °C pendant 30 min</b>, les résidus se transforment en cendres. Videz le cendrier quand il est <b>froid</b>. Jamais de produits chimiques sur la céramique, un chiffon sec suffit. Housse de protection contre les intempéries.</p>

/* ---- filtrage ---- */
function matches(r){
  if(r.cat==="sauces")return false;
  if(curCat!=="all"&&r.cat!==curCat)return false;
  if(favOnly&&!favs.has(rid(r)))return false;
  if(curMode!=="all"){const x=r.mode.toLowerCase();
    if(curMode==="fumage"&&!/fumage|brais|confit/i.test(x))return false;
    if(curMode==="indirect"&&!x.includes("indirect"))return false;
    if(curMode==="direct"&&!x.includes("direct"))return false;}
  if(curTime!=="all"&&timeBucket(r)!==curTime)return false;
  if(curDiff!=="all"&&niveau(r)!==curDiff)return false;
  if(curQ&&!haystack(r).includes(norm(curQ)))return false;
  if(curHave){
    const h=haystack(r);
    const wanted=norm(curHave).split(/[,\s]+/).filter(Boolean);
    if(wanted.length&&!wanted.every(x=>h.includes(x)))return false;
  }
  return true;
}

/* ---- liste ---- */
function card(r){
  const i=RECIPES.indexOf(r),fav=favs.has(rid(r)),niv=niveau(r);
  const nc=niv==='Avancé'?'n3':niv==='Intermédiaire'?'n2':'n1';
  return `<div class="rc" data-i="${i}">
    <div class="top">
      <div><h3>${r.nom}</h3><div class="ori">${r.ori}</div></div>
      <div class="rstack">
        <button class="favstar ${fav?'on':''}" data-fav="${i}">${fav?'★':'☆'}</button>
        <div class="emoji">${emojiFor(r.cat)}</div>
      </div>
    </div>
    <div class="meta">
      <span class="badge mode">${r.mode}</span>
      <span class="badge temp">🌡️ ${r.tempK}</span>
      ${r.coeur?`<span class="badge coeur">à cœur ${r.coeur}</span>`:''}
      <span class="badge">⏱️ ${r.temps}</span>
      <span class="badge niv ${nc}">${niv}</span>
      <span class="badge sauce">Sauce : ${sauceFor(r)}</span>
    </div>
  </div>`;
}
function renderList(){
  const list=RECIPES.filter(matches);
  const bits=[];
  if(favOnly)bits.push("favoris");
  if(curHave)bits.push("avec vos ingrédients");
  $("#count").textContent=`${list.length} recette${list.length>1?'s':''}`+(bits.length?` · ${bits.join(" · ")}`:"");
  if(!list.length){$("#grid").innerHTML=`<div class="empty">Aucune recette ne correspond.<br>Élargissez les filtres, retirez un ingrédient ou changez de mot-clé.</div>`;return;}
  $("#grid").innerHTML=list.map(card).join("");
  $$("#grid .rc").forEach(c=>c.onclick=e=>{if(e.target.classList.contains('favstar'))return;openRecipe(+c.dataset.i);});
  $$("#grid .favstar").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(RECIPES[+b.dataset.fav]);renderStats();renderList();});
}

        <div class="spec"><div class="l">Temp. Kamado</div><div class="v temp">${r.tempK}</div></div>
        ${r.coeur?`<div class="spec"><div class="l">À cœur</div><div class="v coeur">${r.coeur}</div></div>`:''}
        <div class="spec"><div class="l">Cuisson</div><div class="v">${r.temps}</div></div>

      <div class="servrow">

        <button class="stp" id="sPlus">+</button>
        <button class="copybtn" id="sCopy">📋 Liste de courses</button>

      <h4>Ingrédients${f!==1?` <span style="font-weight:400;color:var(--muted);text-transform:none;font-size:11px">(quantités ajustées, indicatives)</span>`:''}</h4>

      </div>

      ${stepsHtml}

/* ---- minuteurs multiples ---- */
const timersWrap=document.createElement("div");timersWrap.id="timers";document.body.appendChild(timersWrap);
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");};
function beepAlarm(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type="sine";o.frequency.value=880;g.gain.value=.001;o.start();let n=0;const iv=setInterval(()=>{g.gain.value=g.gain.value>.05?.001:.35;if(++n>12){clearInterval(iv);o.stop();}},220);}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300,150,400]);}
function startTimer(sec,label){
  const card=document.createElement("div");card.className="tcard";
  card.innerHTML=`<div class="tinfo"><span class="tlab"></span><span class="tnum"></span></div><button class="tbp">⏸</button><button class="tbx">✕</button>`;
  timersWrap.appendChild(card);
  const lab=card.querySelector(".tlab"),num=card.querySelector(".tnum"),bp=card.querySelector(".tbp"),bx=card.querySelector(".tbx");
  let rem=sec,paused=false; lab.textContent=label||"Minuteur"; num.textContent=fmtT(rem);
  const iv=setInterval(()=>{if(paused)return;rem--;num.textContent=fmtT(rem);if(rem<=0){clearInterval(iv);card.classList.add("done");lab.textContent="⏰ "+(label||"Minuteur");beepAlarm();}},1000);
  bp.onclick=()=>{paused=!paused;bp.textContent=paused?"▶":"⏸";};
  bx.onclick=()=>{clearInterval(iv);card.remove();};
}

/* ---- Menus complets kamado ---- */
function pickFrom(list, seed){
  if(!list.length)return null;
  return list[Math.abs(seed)%list.length];
}
function renderMenuBuilder(){
  const M=$("#menus");
  M.innerHTML=`
    <h2>🍱 Composer un menu kamado</h2>
    <div class="callout" style="border-color:var(--accent)">
      <h3>Générateur simple</h3>
      <p style="margin:0 0 10px;color:var(--muted);font-size:13px">Créez un menu cohérent avec une pièce principale, un accompagnement et un dessert cuits au kamado.</p>
      <div class="menu-controls">
        <select id="mStyle" class="fsel">
          <option value="convivial">Convivial</option>
          <option value="rapide">Rapide</option>
          <option value="fumage">Fumage / low & slow</option>
          <option value="vegetarien">Végétarien</option>
        </select>
        <select id="mGuests" class="fsel">
          <option value="4">4 personnes</option>
          <option value="6">6 personnes</option>
          <option value="8">8 personnes</option>
        </select>
        <button id="mGo" class="actbtn on">Générer un menu</button>
      </div>
      <div id="menuOut" class="menu-grid"></div>

  function renderMenu(){
    const style=$("#mStyle").value, guests=$("#mGuests").value;
    let mains=cookingRecipes().filter(r=>!["legumes","dessert","pizza"].includes(r.cat));
    if(style==="rapide")mains=mains.filter(r=>timeBucket(r)==="express");
    if(style==="fumage")mains=mains.filter(r=>/fumage|brais|confit/i.test(r.mode));
    if(style==="vegetarien")mains=cookingRecipes().filter(r=>["vegetarien","legumes","pizza"].includes(r.cat)&&r.cat!=="dessert");
    const sides=cookingRecipes().filter(r=>["legumes","vegetarien","pizza"].includes(r.cat)&&r.cat!=="dessert");
    const desserts=cookingRecipes().filter(r=>r.cat==="dessert");
    const seed=Date.now()+parseInt(guests,10);
    const picks=[
      {label:"Plat principal",r:pickFrom(mains,seed)},
      {label:"Accompagnement",r:pickFrom(sides,seed>>3)},
      {label:"Dessert",r:pickFrom(desserts,seed>>5)}

    $("#menuOut").innerHTML=picks.map(p=>p.r?`

    $$("#menuOut [data-open]").forEach(b=>b.onclick=()=>openRecipe(+b.dataset.open));
  }
  $("#mGo").onclick=renderMenu;
  renderMenu();
}

      <span class="badge">${bases.length} bases</span>
    </div>
    <div class="grid" style="padding:0">${bases.map(card).join("")}</div>`;
  $$("#bases .rc").forEach(c=>c.onclick=e=>{if(e.target.classList.contains('favstar'))return;openRecipe(+c.dataset.i);});
  $$("#bases .favstar").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(RECIPES[+b.dataset.fav]);renderStats();renderBases();});
}

/* ---- Sauvegarde / transfert iPhone + PC ---- */
function exportData(){
  const payload=buildExportPayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="kamado-kokko-sauvegarde.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function buildExportPayload(){
  return {
    app:"kamado-kokko",
    version:1,
    exportedAt:new Date().toISOString(),
    favs:[...favs],
    notes
  };
}
function encodeTransfer(data){
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function decodeTransfer(code){
  return JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
}
function mergeImportedData(data){
  if(data.app!=="kamado-kokko"||!Array.isArray(data.favs)||typeof data.notes!=="object"||data.notes===null)throw new Error("format");
  favs=new Set([...favs,...data.favs]);
  notes={...notes,...data.notes};
  saveFavs();
  LS.set("kokko_notes",notes);
  renderStats();
  renderChips();
  renderFilterBar();
  renderList();
  renderBases();
}
function makeTransferCode(){
  return encodeTransfer(buildExportPayload());
}
function makeTransferLink(){
  return `${location.origin}${location.pathname}#sync=${makeTransferCode()}`;
}
function importHashTransfer(){
  if(!location.hash.startsWith("#sync="))return;
  try{
    mergeImportedData(decodeTransfer(location.hash.slice(6)));
    history.replaceState(null,"",location.pathname);
  }catch(e){}
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      mergeImportedData(data);
      $("#syncStatus").textContent=`Import terminé : ${favs.size} favori(s), ${Object.keys(notes).length} note(s).`;
    }catch(e){
      $("#syncStatus").textContent="Import impossible : fichier de sauvegarde Kamado invalide.";
    }
  };
  reader.readAsText(file);
}
function renderDataTools(){
  const D=$("#donnees");
  D.innerHTML=`
    <h2>💾 Données iPhone + PC</h2>
    <div class="callout" style="border-color:var(--accent)">
      <h3>Sauvegarder et transférer</h3>
      <p style="margin:0">Les favoris et notes restent sur l'appareil, dans le navigateur. Pour les retrouver sur iPhone et PC, exportez une sauvegarde puis importez-la sur l'autre appareil.</p>
      <div class="syncgrid">
        <button id="dataExport" class="syncbtn primary">Exporter mes favoris et notes</button>
        <label class="filepick">Importer une sauvegarde JSON
          <input id="dataImport" type="file" accept="application/json,.json">
        </label>
        <button id="dataCode" class="syncbtn">Créer un code de transfert</button>
        <button id="dataLink" class="syncbtn">Créer un lien de transfert</button>
        <textarea id="transferCode" class="copybox" placeholder="Le code de transfert apparaît ici. Vous pouvez aussi coller un code reçu depuis l'autre appareil."></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button id="copyCode" class="syncbtn">Copier le code</button>
          <button id="importCode" class="syncbtn">Importer ce code</button>
        </div>
        <div id="syncStatus" class="syncstatus"></div>
      </div>
    </div>
    <div class="callout">
      <h3>Installation conseillée</h3>
      <p style="margin:0 0 8px"><b>iPhone :</b> ouvrez le site dans Safari, bouton Partager, puis <span class="kbd">Sur l'écran d'accueil</span>.</p>
      <p style="margin:0"><b>PC :</b> ouvrez le site dans Chrome/Edge, puis utilisez l'icône d'installation dans la barre d'adresse ou le menu du navigateur.</p>
    </div>
    <div class="callout">
      <h3>Hors ligne</h3>
      <p style="margin:0">Après une première ouverture depuis un serveur web, l'application met en cache la page principale pour rester disponible hors connexion. Les notes et favoris restent privés sur chaque appareil.</p>
    </div>`;
  $("#dataExport").onclick=exportData;
  $("#dataImport").onchange=e=>importData(e.target.files[0]);
  $("#dataCode").onclick=()=>{
    $("#transferCode").value=makeTransferCode();
    $("#syncStatus").textContent="Code généré. Copiez-le ou partagez-le vers l'autre appareil.";
  };
  $("#dataLink").onclick=()=>{
    $("#transferCode").value=makeTransferLink();
    $("#syncStatus").textContent="Lien généré. Ouvrez-le sur l'autre appareil pour fusionner les favoris et notes.";
  };
  $("#copyCode").onclick=()=>{
    const code=$("#transferCode").value||makeTransferCode();
    $("#transferCode").value=code;
    const done=()=>{$("#syncStatus").textContent="Code copié."};
    if(navigator.share){navigator.share({title:"Sauvegarde Kamado Kokko",text:code}).then(done).catch(()=>{});}
    else if(navigator.clipboard){navigator.clipboard.writeText(code).then(done).catch(done);}
    else done();
  };
  $("#importCode").onclick=()=>{
    try{
      const raw=$("#transferCode").value.trim();
      const code=raw.includes("#sync=")?raw.split("#sync=")[1]:raw;
      mergeImportedData(decodeTransfer(code));
      $("#syncStatus").textContent=`Code importé : ${favs.size} favori(s), ${Object.keys(notes).length} note(s).`;
    }catch(e){
      $("#syncStatus").textContent="Code invalide ou incomplet.";
    }
  };
}

$("#q").addEventListener("input",e=>{curQ=e.target.value.toLowerCase().trim();renderList();});
$("#have").addEventListener("input",e=>{curHave=e.target.value.trim();renderList();});
$$(".tab").forEach(t=>t.onclick=()=>{

});

$("#guide").innerHTML=GUIDE;
$("#temp").innerHTML=TEMP;
$("#vins").innerHTML=VINS;
renderAssistant();
renderMenuBuilder();
renderBases();
renderDataTools();
renderStats();renderChips();renderFilterBar();renderList();
importHashTransfer();
if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
