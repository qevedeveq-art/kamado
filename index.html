function parseRecipeDuration(recipe) {
  if(Array.isArray(recipe.phases)&&recipe.phases.length){
    const cooking=recipe.phases
      .filter(p=>!/préparation|preparation/i.test(p.mode||""))
      .reduce((sum,p)=>sum+(Number(p.duration_min)||0),0);
    if(cooking>0)return cooking;
  }
  const t = recipe.temps || "";
  if (/h/i.test(t)) {
    const matches = t.match(/(\d+(?:[.,]\d+)?)/g);
    if (matches) {
      const floats = matches.map(x => parseFloat(x.replace(",", ".")));
      const avg = floats.reduce((a, b) => a + b, 0) / floats.length;
      return avg * 60;
    }
  }
  const matches = t.match(/(\d+)/g);
  if (matches) {
    const ints = matches.map(x => parseInt(x));
    if (t.includes("+")) {
      return ints.reduce((a, b) => a + b, 0);
    }
    return ints.reduce((a, b) => a + b, 0) / ints.length;
  }
  return 30;
}

function drawSimulationChart(duration, type) {
  const width = 360;
  const height = 180;
  const paddingLeft = 35;
  const paddingBottom = 25;
  const paddingTop = 15;
  const paddingRight = 15;
  const chartW = width - paddingLeft - paddingRight;
  const chartH = height - paddingTop - paddingBottom;
  
  const points = [];
  const totalSteps = 100;
  let tStart = 10;
  let tEnd = type === "pulledporc" ? 95 : (type === "brisket" ? 94 : 90);
  
  for (let i = 0; i <= totalSteps; i++) {
    const pct = i / totalSteps;
    let temp = tStart;
    
    if (type === "ribs") {
      if (pct < 0.5) {
        temp = tStart + (65 - tStart) * Math.sin((pct / 0.5) * Math.PI / 2);
      } else if (pct < 0.83) {
        const p = (pct - 0.5) / 0.33;
        temp = 65 + (88 - 65) * p;
      } else {
        const p = (pct - 0.83) / 0.17;
        temp = 88 + (90 - 88) * Math.sin(p * Math.PI / 2);
      }
    } else {
      if (pct < 0.35) {
        const p = pct / 0.35;
        temp = tStart + (68 - tStart) * Math.sin(p * Math.PI / 2);
      } else if (pct < 0.65) {
        const p = (pct - 0.35) / 0.30;
        temp = 68 + 3 * Math.sin(p * Math.PI / 2);
      } else {
        const p = (pct - 0.65) / 0.35;
        temp = 71 + (tEnd - 71) * (1 - Math.cos(p * Math.PI / 2));
      }
    }
    
    const x = paddingLeft + pct * chartW;
    const y = paddingTop + chartH - ((temp - tStart) / (100 - tStart)) * chartH;
    points.push({ x, y });
  }
  
  const pathD = `M ${points[0].x} ${points[0].y} ` + points.slice(1).map(p => `L ${p.x} ${p.y}`).join(" ");
  const gridLines = [];
  if (type !== "ribs") {
    const yStall = paddingTop + chartH - ((70 - tStart) / (100 - tStart)) * chartH;
    gridLines.push(`
      <line x1="${paddingLeft}" y1="${yStall}" x2="${width - paddingRight}" y2="${yStall}" stroke="rgba(242,169,59,0.3)" stroke-width="1.5" stroke-dasharray="3 3" />
      <text x="${width - paddingRight}" y="${yStall - 4}" fill="var(--accent2)" font-size="9" font-weight="700" text-anchor="end">Plateau (Stall) ≈ 70°C</text>
    `);
  }
  
  let keyMarkers = "";
  if (type === "ribs") {
    const p3h = points[Math.round(totalSteps * 0.5)];
    keyMarkers += `<circle cx="${p3h.x}" cy="${p3h.y}" r="4" fill="var(--accent)" />
                   <text x="${p3h.x}" y="${p3h.y - 8}" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">Emballage (3h)</text>`;
    const p5h = points[Math.round(totalSteps * 0.83)];
    keyMarkers += `<circle cx="${p5h.x}" cy="${p5h.y}" r="4" fill="var(--accent)" />
                   <text x="${p5h.x}" y="${p5h.y - 8}" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">Laquage (5h)</text>`;
  } else {
    const pEmb = points[Math.round(totalSteps * 0.5)];
    keyMarkers += `<circle cx="${pEmb.x}" cy="${pEmb.y}" r="4" fill="var(--accent)" />
                   <text x="${pEmb.x}" y="${pEmb.y - 8}" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">Emballage</text>`;
  }
  
  return `
    <svg class="sim-chart" width="360" height="180" viewBox="0 0 360 180" style="background:var(--bg2); border:1px solid var(--line); border-radius:var(--border-radius-md); margin:12px 0 6px; display:block; max-width:100%; height:auto;">
      <line x1="${paddingLeft}" y1="${paddingTop}" x2="${paddingLeft}" y2="${height - paddingBottom}" stroke="var(--line)" stroke-width="1.5" />
      <line x1="${paddingLeft}" y1="${height - paddingBottom}" x2="${width - paddingRight}" y2="${height - paddingBottom}" stroke="var(--line)" stroke-width="1.5" />
      <line x1="${paddingLeft}" y1="${paddingTop}" x2="${width - paddingRight}" y2="${paddingTop}" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <line x1="${paddingLeft}" y1="${paddingTop + chartH/2}" x2="${width - paddingRight}" y2="${paddingTop + chartH/2}" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      
      <text x="${paddingLeft - 8}" y="${paddingTop + 4}" fill="var(--muted)" font-size="9" text-anchor="end">100°C</text>
      <text x="${paddingLeft - 8}" y="${paddingTop + chartH/2 + 4}" fill="var(--muted)" font-size="9" text-anchor="end">55°C</text>
      <text x="${paddingLeft - 8}" y="${height - paddingBottom + 4}" fill="var(--muted)" font-size="9" text-anchor="end">10°C</text>
      
      <text x="${paddingLeft}" y="${height - paddingBottom + 16}" fill="var(--muted)" font-size="9" text-anchor="start">0h</text>
      <text x="${width - paddingRight}" y="${height - paddingBottom + 16}" fill="var(--muted)" font-size="9" text-anchor="end">${duration.toFixed(1)}h</text>
      
      ${gridLines.join("")}
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
      ${keyMarkers}
      <text x="${paddingLeft + 10}" y="${paddingTop + 14}" fill="var(--green)" font-size="9" font-weight="700">📈 Température à cœur</text>
    </svg>
  `;
}

    while (startM < 0) {

      m: sM,
      type: "meal",
      txt: "<b>🍽️ À table !</b> Toutes les cuissons sont prêtes. Servez chaud."
    });
    
    timeline.sort((a, b) => {
      const aVal = ((a.h + 24) % 24) * 60 + a.m;
      const bVal = ((b.h + 24) % 24) * 60 + b.m;
      return aVal - bVal;
    });
    
    let html = `<div style="font-weight:800;color:var(--accent2);margin-bottom:10px">⏰ Chronologie de votre session :</div>`;
    html += `<div class="timeline" style="display:flex; flex-direction:column; gap:12px; position:relative; padding-left:24px; border-left:2px solid var(--line)">`;
    timeline.forEach(step => {
      let color = "var(--muted)";
      if (step.type === "fire") color = "var(--accent)";
      else if (step.type === "adjust") color = "var(--accent2)";
      else if (step.type === "cooking") color = "var(--blue)";
      else if (step.type === "rest") color = "var(--green)";
      else if (step.type === "meal") color = "var(--ember)";

  const dish=document.querySelector("#aDish");presets.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.n;dish.appendChild(o);});

  const meatEl=document.querySelector("#aCharMeat"), modeEl=document.querySelector("#aCharMode"), weightEl=document.querySelector("#aCharWeight"), outEl=document.querySelector("#aCharOut");

        `<b>Zone de plateau (Stall)</b> : L'évaporation de l'eau bloque la montée en température. C'est normal.`,

        `<b>Étape 3 (Terminer)</b> : Cuisez jusqu'à atteindre 93 °C à cœur.`,

      temp = "110–120 °C";
      core = "90 °C (os se décolle)";

  return list[Math.abs(seed)%list.length];
}

/* ---- Sauvegarde / transfert iPhone + PC ---- */
function exportData(){
  const payload=buildExportPayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="kamado-kokko-sauvegarde.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function buildExportPayload(){
  return {
    app:"kamado-kokko",
    version:2,
    exportedAt:new Date().toISOString(),
    favs:[...favs],
    notes,
    ratings,
    history:viewHistory,
    shopping:shoppingList,
    pantryProfile,
    session:savedSession
  };
}
function encodeTransfer(data){
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  let bin="";
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function decodeTransfer(code){
  const cleaned=code.trim().replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  const padded=cleaned+"=".repeat((4-cleaned.length%4)%4);
  const bin=atob(padded);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function mergeImportedData(data){
  if(data.app!=="kamado-kokko"||!Array.isArray(data.favs)||typeof data.notes!=="object"||data.notes===null)throw new Error("format");
  favs=new Set([...favs,...data.favs]);
  notes={...notes,...data.notes};
  if(data.ratings&&typeof data.ratings==="object")ratings={...ratings,...data.ratings};
  if(Array.isArray(data.shopping))shoppingList=[...shoppingList,...data.shopping].filter((x,i,a)=>a.findIndex(y=>y.txt===x.txt&&y.recipe===x.recipe)===i);
  if(data.pantryProfile&&typeof data.pantryProfile==="object")pantryProfile={...pantryProfile,...data.pantryProfile};
  if(data.session&&typeof data.session==="object")savedSession={...savedSession,...data.session};
  viewHistory=[...(Array.isArray(data.history)?data.history:[]),...viewHistory].filter((x,i,a)=>a.indexOf(x)===i).slice(0,8);
  saveFavs();
  LS.set("kokko_notes",notes);
  LS.set("kokko_ratings",ratings);
  LS.set("kokko_shopping",shoppingList);
  LS.set("kokko_pantry_profile",pantryProfile);
  LS.set("kokko_session",savedSession);
  LS.set("kokko_history",viewHistory);
  curHave=pantryProfile.have||"";curDiet=multiValues(pantryProfile.diet);curEquip=multiValues(pantryProfile.equipment);curAvailable=pantryProfile.available||"all";
  if($("#have"))$("#have").value=curHave;
  renderStats();
  renderHistory();
  renderChips();
  renderFilterBar();
  renderSmartBar();
  renderList();
  renderBases();
}
function makeTransferCode(){
  return encodeTransfer(buildExportPayload());
}
function makeTransferLink(){
  return `${location.origin}${location.pathname}#sync=${makeTransferCode()}`;
}
function importHashTransfer(){
  if(!location.hash.startsWith("#sync="))return;
  try{
    mergeImportedData(decodeTransfer(location.hash.slice(6)));
    window.history.replaceState(null,"",location.pathname);
  }catch(e){}
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      mergeImportedData(data);
      $("#syncStatus").textContent=`Import terminé : ${favs.size} favori(s), ${Object.keys(notes).length} note(s), ${Object.keys(ratings).length} note(s) chiffrée(s).`;
    }catch(e){
      $("#syncStatus").textContent="Import impossible : fichier de sauvegarde Kamado invalide.";
    }
  };
  reader.readAsText(file);
}

const TAB_NAMES=["recettes","menus","bases","guide","temp","vins","assistant","donnees"];
function activateTab(target){
  $$(".tab").forEach(x=>{
    const isActive=x===target;
    x.classList.toggle("active",isActive);
    x.setAttribute("aria-selected",isActive?"true":"false");
    x.setAttribute("tabindex",isActive?"0":"-1");
  });
  TAB_NAMES.forEach(n=>$("#tab-"+n).classList.toggle("hide",n!==target.dataset.tab));
  if(target.dataset.tab==="assistant"){
    shoppingList=LS.get("kokko_shopping",[]);
    renderAssistant();
  }
  const prefersReduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0,behavior:prefersReduced?"auto":"smooth"});
}
$$(".tab").forEach((t,i,arr)=>{
  t.onclick=()=>activateTab(t);
  t.addEventListener("keydown",e=>{
    let nextIdx=null;
    if(e.key==="ArrowRight"||e.key==="ArrowDown")nextIdx=(i+1)%arr.length;
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp")nextIdx=(i-1+arr.length)%arr.length;
    else if(e.key==="Home")nextIdx=0;
    else if(e.key==="End")nextIdx=arr.length-1;
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();activateTab(t);return;}
    if(nextIdx!=null){
      e.preventDefault();
      arr[nextIdx].focus();
      activateTab(arr[nextIdx]);
    }
  });
});

/* ---- smart header escamotable ---- */
let lastScrollY = window.scrollY;
let scrollTicking = false;
const headerEl = $("header");
window.addEventListener("scroll", () => {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => {
    const currentScrollY = window.scrollY;
    if (currentScrollY > lastScrollY && currentScrollY > 120) {
      headerEl.classList.add("header-hidden");
    } else if (currentScrollY < lastScrollY || currentScrollY <= 20) {
      headerEl.classList.remove("header-hidden");
    }
    lastScrollY = currentScrollY;
    scrollTicking = false;
  });
}, { passive: true });
